name: build

# Produces installable binaries for Android, Windows and iOS, then re-packs
# each one as an .tar.xz archive compressed with LZMA2 at its extreme preset.
# GitHub always serves artifacts inside a zip envelope; putting an already
# maximally-compressed .tar.xz inside that zip is what keeps the download small.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 3.47+ is required for the Windows job: GitHub's windows runners now ship
  # Visual Studio 2026, and only Flutter 3.47 and later map that major version
  # to the "Visual Studio 18 2026" CMake generator. Older Flutter detects the
  # install happily and then emits the 2019 generator, which CMake rejects.
  FLUTTER_VERSION: '3.47.2'
  XZ_OPT: '-9e --threads=0'
  # Stamped into the Windows installer. Kept in step with app/pubspec.yaml.
  APP_VERSION: '1.3.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- analysis
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: install dependencies
        working-directory: app
        run: flutter pub get
      - name: verify formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: analyze
        working-directory: app
        run: flutter analyze --fatal-infos
      - name: test
        working-directory: app
        run: flutter test

  # ---------------------------------------------------------------- android
  android:
    name: android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # Google Play rejects a debug-signed bundle. If the repository carries
      # an upload key, the release build is signed with it; if not, the build
      # still runs (debug-signed) and the Play artifact says so, so a fork
      # without secrets is never broken by this step.
      - name: restore the upload key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "signed=true" >> "$GITHUB_ENV"

      # --split-per-abi keeps each APK to one architecture, which removes the
      # other two copies of the Flutter engine from every download.
      - name: build apks
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons

      # The arm64 APK is what almost every phone in use actually needs, so it
      # is published on its own rather than buried in an archive with the
      # other ABIs and the bundle.
      - name: pack the arm64 apk
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk .
          xz -9e --threads=0 --keep --force app-arm64-v8a-release.apk
          ls -lh app-arm64-v8a-release.apk*

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-arm64-apk
          path: app-arm64-v8a-release.apk.xz
          compression-level: 0        # the payload is already xz'd
          if-no-files-found: error

      # What actually gets uploaded to Google Play: the bundle, plus the two
      # maps Play needs to make a crash report from an obfuscated build
      # readable again.
      - name: pack the Play bundle
        run: |
          mkdir -p play
          cp app/build/app/outputs/bundle/release/*.aab play/qamus-release.aab
          find app/build/app/outputs/mapping -name 'mapping.txt' \
            -exec cp {} play/android-r8-mapping.txt \; 2>/dev/null || true
          mkdir -p play/debug-symbols
          cp -r app/build/symbols/. play/debug-symbols/ 2>/dev/null || true
          if [ "${signed:-}" = "true" ]; then
            state="signed with the repository's upload key"
          else
            state="SIGNED WITH THE DEBUG KEY — Play will reject it as is"
          fi
          cat > play/README.txt <<EOF
          Google Play upload — قاموس المعاني
          ==================================
          application id : com.elyasomar.arabic.qamus
          version        : ${APP_VERSION}
          bundle         : qamus-release.aab  ($state)

          Upload qamus-release.aab under Production > Create new release.

          Deobfuscation. Play Console > App bundle explorer > Downloads:
            android-r8-mapping.txt   the Java/Kotlin names R8 renamed
            debug-symbols/           the Dart names --obfuscate renamed
          Without both, a crash report from this build is unreadable.

          Signing. If the line above says DEBUG KEY, add four repository
          secrets and re-run this workflow:
            ANDROID_KEYSTORE_BASE64    base64 of your upload-keystore.jks
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          Create the keystore once, and keep it — losing it means you can
          never update this listing again:
            keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA \
              -keysize 2048 -validity 10000 -alias upload
            base64 -w0 upload-keystore.jks   # paste into the secret

          Privacy policy (Play requires a public URL):
            https://sites.google.com/view/qamoos-arabi/privacy
            source: docs/privacy-policy.html in this repository
          EOF
          tar -C play -cf - . | xz -9e --threads=0 > qamus-googleplay.tar.xz
          ls -lh play qamus-googleplay.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-googleplay
          path: qamus-googleplay.tar.xz
          compression-level: 0
          if-no-files-found: error

      - name: pack the remaining builds
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk out/
          cp app/build/app/outputs/bundle/release/*.aab out/
          # Both halves of the build rename their symbols, and both leave a
          # map behind. Without these a crash report from a release build is
          # unreadable — they ship beside the binaries, never inside them.
          mkdir -p out/symbols
          cp -r app/build/symbols/. out/symbols/ 2>/dev/null || true
          find app/build/app/outputs/mapping -name 'mapping.txt' \
            -exec cp {} out/symbols/android-r8-mapping.txt \; 2>/dev/null || true
          tar -C out -cf - . | xz -9e --threads=0 > qamus-android-other.tar.xz
          ls -lh out qamus-android-other.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-android-other
          path: qamus-android-other.tar.xz
          compression-level: 0
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # Prints the Visual Studio version Flutter will build against; a mismatch
      # here is what a "could not find any instance of Visual Studio" CMake
      # error actually means. See the FLUTTER_VERSION comment above.
      - name: report toolchain
        working-directory: app
        run: flutter doctor -v

      - name: build
        working-directory: app
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols
          --tree-shake-icons

      - name: pack
        shell: bash
        run: |
          # Several Release directories exist under build/windows (each plugin
          # gets one); only the runner's holds the executable and its bundle.
          release=app/build/windows/x64/runner/Release
          [ -d "$release" ] || release=$(find app/build/windows -type d -path '*runner/Release' | head -n 1)
          [ -x "$release/qamus.exe" ] || { echo "no runner bundle at $release"; exit 1; }
          mkdir -p out/qamus
          cp -r "$release"/* out/qamus/
          rm -f out/qamus/*.pdb
          tar -C out -cf - . | xz -9e --threads=0 > qamus-windows.tar.xz
          ls -lh qamus-windows.tar.xz

      # One file that installs and runs on its own. Flutter's Windows output is
      # an exe plus DLLs and a data/ tree, none of which works alone; Inno
      # Setup (preinstalled on the runner) folds the lot into a single .exe.
      - name: build the single-file installer
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$release/qamus.exe")) {
            throw "no runner bundle at $release"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found on this runner" }
          $bundle = (Resolve-Path $release).Path
          & $iscc /Qp "/DBundleDir=$bundle" "/DAppVersion=$env:APP_VERSION" `
            "/O$((Resolve-Path .).Path)" app/windows/packaging/qamus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-Item qamus-setup.exe | Format-List Name, Length

      - name: compress the installer
        shell: bash
        run: |
          xz -9e --threads=0 --keep --force qamus-setup.exe
          ls -lh qamus-setup.exe.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-windows-exe
          path: qamus-setup.exe.xz
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-windows
          path: qamus-windows.tar.xz
          compression-level: 0
          if-no-files-found: error

  # -------------------------------------------------------------------- ios
  ios:
    name: ios
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # Unsigned: a signed build needs a paid Apple team, so CI produces the
      # .app that a developer can sign locally or that sideloaders accept.
      - name: build
        working-directory: app
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols
          --tree-shake-icons

      - name: pack
        run: |
          mkdir -p out/Payload
          cp -R app/build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -0 -qry ../qamus-unsigned.ipa Payload)
          rm -rf out
          mkdir -p out && mv qamus-unsigned.ipa out/
          tar -C out -cf - . | xz -9e --threads=0 > qamus-ios.tar.xz
          ls -lh qamus-ios.tar.xz

      # What App Store Connect needs: an archive Xcode can open in the
      # Organizer and distribute. Signing needs a paid Apple team, which CI
      # does not have, so the archive is built unsigned and exported on the
      # developer's own Mac with the plist beside it.
      - name: build the App Store archive
        working-directory: app
        run: |
          flutter build ipa --release --no-codesign \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons \
            --export-options-plist=ios/ExportOptions.plist || \
          flutter build ipa --release --no-codesign \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons
          ls -R build/ios/archive || true

      - name: pack the App Store archive
        run: |
          mkdir -p store
          archive=$(find app/build/ios/archive -maxdepth 1 -name '*.xcarchive' | head -n 1)
          [ -n "$archive" ] || { echo "no .xcarchive produced"; exit 1; }
          cp -R "$archive" store/
          cp app/ios/ExportOptions.plist store/
          mkdir -p store/debug-symbols
          cp -r app/build/symbols/. store/debug-symbols/ 2>/dev/null || true
          # A signed .ipa, if flutter managed to export one without a team.
          find app/build/ios/ipa -name '*.ipa' -exec cp {} store/ \; 2>/dev/null || true
          cat > store/README.txt <<EOF
          App Store upload — قاموس المعاني
          ================================
          bundle id : com.elyasomar.arabic.qamus
          version   : ${APP_VERSION}
          archive   : Runner.xcarchive (UNSIGNED — signing needs your team)

          On your Mac, either:

            1. Open Runner.xcarchive (double-click). Xcode Organizer opens.
               Distribute App > App Store Connect > Upload. Xcode signs it
               with your team along the way.

            2. Or from the terminal, with ExportOptions.plist beside it:
               xcodebuild -exportArchive \
                 -archivePath Runner.xcarchive \
                 -exportOptionsPlist ExportOptions.plist \
                 -exportPath ./export
               then upload export/*.ipa with Transporter.

          Set teamID in ExportOptions.plist to your Apple team before
          exporting from the terminal; Organizer asks for it instead.

          debug-symbols/ holds the Dart names --obfuscate renamed. Keep them:
          without them a crash report from this build is unreadable.

          Privacy policy (App Store requires a public URL):
            https://sites.google.com/view/qamoos-arabi/privacy
          EOF
          tar -C store -cf - . | xz -9e --threads=0 > qamus-appstore.tar.xz
          ls -lh qamus-appstore.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-appstore
          path: qamus-appstore.tar.xz
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-ios
          path: qamus-ios.tar.xz
          compression-level: 0
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.xz
            artifacts/**/*.apk.xz
            artifacts/**/*.exe.xz
            artifacts/**/*.aab
          generate_release_notes: true
